# Feature 150 — genereert de pagina's uit het openbare manifest. Geen geheimen: het manifest is openbaar en bevat per
# constructie alleen gesloten rondes. Commit alleen bij echt verschil.
#
# ⭐ Geen eigen schema meer (migratie 169, 06-11): GitHub hield het kwartier niet aan, en het was 1.300 runs per twee
#    weken voor één wijziging. De cron klopt-webronde-controle in Supabase start deze Action alleen als
#    speel-bestanden/inhoud.txt afwijkt van het manifest. Met de hand starten kan altijd.
name: publiceer
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  genereer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Genereren
        # Rechtstreeks bij de functie: zo staan de pagina's al klaar vóór de Netlify-deploy die /w/ pas mogelijk maakt.
        run: node bron/genereer.mjs https://zolgrisaorbzhqszjvwv.supabase.co/functions/v1/webronde/manifest .
      - name: Committen bij verschil
        run: |
          git config user.name "Klopt!"
          git config user.email "noreply@klopt-app.nl"
          git add speel quiz quizzen sitemap.xml speel-bestanden
          if git diff --cached --quiet; then
            echo "geen verschil"
          else
            git diff --cached --name-only > gewijzigd.txt
            git commit -q -m "Pagina's bijgewerkt"
            git push -q
          fi
      - name: IndexNow (Bing, Yandex, Seznam, Naver)
        # Meldt de gewijzigde pagina's meteen aan, in plaats van te wachten tot Bing de sitemap opnieuw leest. De index
        # van Bing voedt ook de zoekfunctie van ChatGPT en Copilot. De sleutel is openbaar van opzet en staat als
        # bestand in site/ (Netlify), op de wortel van klopt-app.nl.
        # ⚠️ Faalt nooit de Action: een gemiste aanmelding kost alleen tijd, de sitemap vangt hem op.
        if: hashFiles('gewijzigd.txt') != ''
        run: |
          urls=$(sed -n -E 's#^(speel|quizzen|quiz/[^/]+)/index\.html$#https://klopt-app.nl/\1/#p' gewijzigd.txt | sort -u)
          if [ -z "$urls" ]; then echo "geen pagina gewijzigd"; exit 0; fi
          echo "$urls"
          # GitHub Pages heeft even nodig; meld pas aan als de nieuwe versie te lezen is.
          sleep 60
          lijst=$(printf '%s\n' $urls | sed 's/.*/"&"/' | paste -sd, -)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"klopt-app.nl\",\"key\":\"3f95c6351b166cfcbd1a3bb531360c7d\",\"keyLocation\":\"https://klopt-app.nl/3f95c6351b166cfcbd1a3bb531360c7d.txt\",\"urlList\":[$lijst]}" || true)
          echo "IndexNow: HTTP $code (200/202 = ontvangen)"
